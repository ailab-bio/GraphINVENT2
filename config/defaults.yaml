# Every GraphINVENT2 parameter and its default value.
#
# Three layers are merged key by key, later wins:
#   1. this file
#   2. experiments/<exp>/experiment.yaml   (optional)
#   3. experiments/<exp>/jobs/<job>/config.yaml
#
# Omitting a key inherits it. The merged result is written to the job's
# results/config.resolved.yaml.

# --- what to run -----------------------------------------------------------

# preprocess | unconditional | conditional | goal_directed | generate
job_type: null

# Where datasets live. A relative dataset_dir is resolved against this, so a
# cluster points it at a project filesystem instead of editing every job.
# Cluster home directories have small quotas and preprocessed HDF5 runs to tens
# of gigabytes, so on a cluster this is an absolute path on the project
# filesystem, e.g.
#   data_root: /nobackup/proj/disk/naiss2024-5-630/GraphINVENT2/data/datasets
# The experiments root needs no setting of its own: the job directory is the
# argument to submit.py, so it is wherever the repository was cloned.
data_root: data/datasets

# dataset directory holding train.smi, valid.smi, test.smi and the HDF5 files;
# relative paths are taken as relative to data_root
dataset_dir: null

# 0 = non-deterministic; any positive integer fixes all RNG sources
seed: 0

# cuda | mps | cpu; "cuda" falls back to mps then cpu when unavailable
device: cuda

# --- preprocessing ---------------------------------------------------------

# source file to split into train/valid/test; null = dataset_dir is pre-split
smiles_file: null

# scaffold | random | custom
split_type: scaffold
train_frac: 0.8
valid_frac: 0.1

# derive atom_types, formal_charge, imp_H and max_n_nodes from the SMILES
auto_detect_features: true

# extra .smi file or dataset directory to include in the feature scan, so a
# transfer-learning pair shares one vocabulary
extra_dataset: null

# feature vocabulary; empty means auto-detected
atom_types: []
formal_charge: []
imp_H: []
chirality: ["None", "R", "S"]
max_n_nodes: 0

use_aromatic_bonds: true
use_canon: true
use_chirality: false
use_explicit_H: false
ignore_H: false

# breadth-first ("bfs") or depth-first ("dfs") decoding route
decoding_route: bfs

# resume an interrupted preprocessing or training job from its saved state
restart: false

# --- training --------------------------------------------------------------

batch_size: 1000
block_size: 100000
epochs: 100
init_lr: 1.0e-4
max_rel_lr: 10
min_rel_lr: 1.0e-4
accumulation_steps: 10
n_workers: 0

# epochs between sampling runs during training
sample_every: 10
# molecules generated per sampling run
n_samples: 2000

use_tensorboard: false

# checkpoint to continue training from; setting it makes an unconditional job
# a transfer-learning job
resume_from: null

# --- model architecture ----------------------------------------------------
#
# These keys come from the checkpoint when resume_from or pretrained_model_path
# is set. Setting one to a conflicting value there is an error.

enn_depth: 2
enn_dropout_p: 0.0
enn_hidden_dim: 128
mlp1_depth: 2
mlp1_dropout_p: 0.0
mlp1_hidden_dim: 256
mlp2_depth: 2
mlp2_dropout_p: 0.0
mlp2_hidden_dim: 256
gather_att_depth: 2
gather_att_dropout_p: 0.0
gather_att_hidden_dim: 128
gather_emb_depth: 2
gather_emb_dropout_p: 0.0
gather_emb_hidden_dim: 128
gather_width: 100
hidden_node_features: 100
message_passes: 3
message_size: 100

# --- conditional generation ------------------------------------------------

# null = unconditional; {"properties": ["pLogS"], "source": "smiles_file"}
conditioning: null
# 0 = unconditional; N = N-dimensional property vector
condition_dim: 0
# condition encoder output size; 0 means use hidden_node_features
condition_embedding_dim: 0
# injection mechanism; only "virtual_node" is implemented
condition_type: virtual_node
# property values to generate with, e.g. {"pLogS": -1.5}
sample_conditions: null

# a generated molecule counts as hitting its requested condition value when the
# achieved property is within this much of it, per property name. CLAUDE.md's
# condition_success_rate_<property> is defined against this tolerance.
condition_tolerance: null

# --- goal-directed RL ------------------------------------------------------

# checkpoint the agent and the frozen prior start from
pretrained_model_path: null

# "target_size={int}", "logp_target={float}", "QED", "{name}_activity", or the
# name of an entry in `oracles`
score_components: ["QED"]
score_thresholds: [0.5]
# "continuous" ignores the thresholds; "binary" scores 1 iff all are met
score_type: binary

# paths to pickled scikit-learn activity models, keyed by score component
qsar_models: {}

# user-defined oracles, {name: spec}; spec has "type" ("sklearn" | "python" |
# "vina") plus that type's parameters, and optional "transform"/"direction"
oracles: {}

# uncertainty-aware reward and loss shaping (Medina & Janet, arXiv:2606.24990)
# "mode": none | score | loss | both; "components" maps a component to its method
uncertainty_modulation: {}

# --- RL schedule: separate keys, not the supervised ones -------------------
# A learning step is not an epoch. Reusing `epochs` and `sample_every` for
# reinforcement learning meant the two paths could not take different values,
# and a change to the supervised defaults silently changed every optimization
# run. A goal_directed job that sets `epochs` or `sample_every` is rejected.
# Defaults from Atance et al. 2022, which CLAUDE.md already cites.
rl_steps: 200
rl_best_agent_every: 5
rl_eval_every: 5
# per experiment; null means fall back to `batch_size`
rl_batch_size: null

# contribution of the score to the augmented log-likelihood
sigma: 20
# contribution of the best agent so far (BASF) to the loss, in [0, 1]
alpha: 0.5

# total oracle call budget; null = run for `epochs` steps instead
oracle_budget: null
# oracle call counts at which to checkpoint and evaluate
checkpoint_oracle_counts: [1000, 3000, 10000]
eval_sample_size: 30000
# a molecule is a success at or above this score
success_threshold: 0.5

# What success_rate counted, in words. Set per experiment beside
# success_threshold: a rate with no statement of the criterion is not readable,
# and for a composite objective the threshold alone does not carry it. Echoed
# verbatim into metrics.json.
success_definition: null

# --- generation and evaluation ---------------------------------------------

# "generate" writes molecules and metrics; "evaluate" computes NLL and UC-JSD
sample_mode: generate

# Is this dataset bifunctional (PROTACs, degraders)? It changes which
# synthesizability measure is reported and gated on, because whole-molecule SA
# score reads a PROTAC's size as difficulty: on 500 real TPD-DB degraders the
# median SA is 4.71 and 58.6% fail `sa_score < 4.5`, against 2.87 and 6.2% for
# drug-like ZINC. Those degraders were made, so the gate rejects chemistry that
# exists.
#   true  -> retrotac_mean/_median are reported, and quality_filtered_top10_mean
#            gates on RetroTAC instead of SA score. Needs tools/RetroTAC.
#   false -> SA score only, which is correct for drug-like molecules and for
#            molecular glues.
# SA score is reported either way, and for a bifunctional dataset it is also
# the right measure for the decomposed warheads, where molecules are drug-sized.
bifunctional: false

# property_window_rate: the fraction of unique valid molecules whose every
# named property falls inside its window. Each experiment sets its own bounds
# and they are echoed into metrics.json beside the value, because the rate is
# meaningless without them. The default is the Rule of 5, which suits the
# drug-like development sets; a degrader or electrolyte program overrides it.
property_window:
  mol_weight: [null, 500.0]
  logp: [null, 5.0]
  hbd: [null, 5.0]
  hba: [null, 10.0]

# --- SLURM -----------------------------------------------------------------

# Everything that differs between clusters lives here. Another cluster is a
# different block, not a code change. The values below are Arrhenius.

slurm:
  # MANDATORY: the project to charge. Submission fails without it.
  # A GPU job may need a -gpu suffix on the account name while a CPU job uses
  # the bare name; on Arrhenius it does, e.g. naiss2024-5-630-gpu for a GPU job
  # and naiss2024-5-630 for a CPU one.
  account: null

  # A CPU job is charged to the bare project name on Arrhenius while a GPU job
  # needs the -gpu suffix, so submit.py strips the suffix when gpus is 0. Set
  # this only if your cluster names the CPU account some other way.
  account_cpu: null

  # Left unset, partition_gpu is used when gpus > 0 and partition_cpu otherwise.
  partition: null
  partition_cpu: cpu
  partition_gpu: gpu

  # Always set explicitly: the Arrhenius default is 2 hours, which kills a
  # real training run part-way through. See the walltime procedure in RUN.md.
  time: "24:00:00"

  # One GH200 superchip: one GPU, one task, 72 cores. Not a whole node.
  gpus: 1
  ntasks: 1
  cpus_per_task: 72

  # null leaves it to the partition default, which on a GPU node is the memory
  # attached to the requested superchip.
  memory: null

  # Lmod modules, loaded in order. A different cluster is a different list.
  modules:
    - GPU/buildenv-nvhpc/25.9-cu13.0
