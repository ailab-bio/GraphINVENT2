# Every GraphINVENT2 parameter and its default value.
#
# Three layers are merged key by key, later wins:
#   1. this file
#   2. experiments/<exp>/experiment.yaml   (optional)
#   3. experiments/<exp>/jobs/<job>/config.yaml
#
# Omitting a key inherits it. The merged result is written to the job's
# results/config.resolved.yaml.

# --- what to run -----------------------------------------------------------

# preprocess | unconditional | conditional | goal_directed | generate
job_type: null

# Where datasets live. A relative dataset_dir is resolved against this, so a
# cluster points it at a project filesystem instead of editing every job.
# Cluster home directories have small quotas and preprocessed HDF5 runs to tens
# of gigabytes, so on a cluster this is an absolute path on the project
# filesystem, e.g.
#   data_root: /nobackup/proj/disk/naiss2024-5-630/GraphINVENT2/data/datasets
# The experiments root needs no setting of its own: the job directory is the
# argument to submit.py, so it is wherever the repository was cloned.
data_root: data/datasets

# dataset directory holding train.smi, valid.smi, test.smi and the HDF5 files;
# relative paths are taken as relative to data_root
dataset_dir: null

# 0 = non-deterministic; any positive integer fixes all RNG sources
seed: 0

# cuda | mps | cpu; "cuda" falls back to mps then cpu when unavailable
device: cuda

# --- preprocessing ---------------------------------------------------------

# source file to split into train/valid/test; null = dataset_dir is pre-split
smiles_file: null

# scaffold | random | custom
split_type: scaffold
train_frac: 0.8
valid_frac: 0.1

# derive atom_types, formal_charge, imp_H and max_n_nodes from the SMILES
auto_detect_features: true

# extra .smi file or dataset directory to include in the feature scan, so a
# transfer-learning pair shares one vocabulary
extra_dataset: null

# feature vocabulary; empty means auto-detected
atom_types: []
formal_charge: []
imp_H: []
chirality: ["None", "R", "S"]
max_n_nodes: 0

use_aromatic_bonds: true
use_canon: true
use_chirality: false
use_explicit_H: false
ignore_H: false

# breadth-first ("bfs") or depth-first ("dfs") decoding route
decoding_route: bfs

# resume an interrupted preprocessing or training job from its saved state. It
# never decides whether to re-split: a preprocess job whose split parameters
# differ from the ones recorded in the split directory raises either way.
restart: false

# --- training --------------------------------------------------------------

batch_size: 1000
block_size: 100000
epochs: 100
init_lr: 1.0e-4
max_rel_lr: 10
min_rel_lr: 1.0e-4
accumulation_steps: 10
n_workers: 0

# epochs between sampling runs during training
sample_every: 10
# molecules generated per sampling run
n_samples: 2000

use_tensorboard: false

# the from-scratch control job directory for a transfer job, e.g.
# experiments/mg_transfer/jobs/scratch. Its convergence log is overlaid on
# this job's training curves, which is the only way the transfer claim is
# legible: reaching the same final loss in fewer epochs is the claim, and one
# curve cannot show it. Null for a job that is not a transfer arm.
control_job_dir: null

# checkpoint to continue training from; setting it makes an unconditional job
# a transfer-learning job
resume_from: null

# --- model architecture ----------------------------------------------------
#
# These keys come from the checkpoint when resume_from or pretrained_model_path
# is set. Setting one to a conflicting value there is an error.

enn_depth: 2
enn_dropout_p: 0.0
enn_hidden_dim: 128
mlp1_depth: 2
mlp1_dropout_p: 0.0
mlp1_hidden_dim: 256
mlp2_depth: 2
mlp2_dropout_p: 0.0
mlp2_hidden_dim: 256
gather_att_depth: 2
gather_att_dropout_p: 0.0
gather_att_hidden_dim: 128
gather_emb_depth: 2
gather_emb_dropout_p: 0.0
gather_emb_hidden_dim: 128
gather_width: 100
hidden_node_features: 100
message_passes: 3
message_size: 100

# --- conditional generation ------------------------------------------------

# null = unconditional; {"properties": ["pLogS"], "source": "smiles_file"}
conditioning: null
# 0 = unconditional; N = N-dimensional property vector
condition_dim: 0
# condition encoder output size; 0 means use hidden_node_features
condition_embedding_dim: 0
# injection mechanism; only "virtual_node" is implemented
condition_type: virtual_node
# property values to generate with, e.g. {"pLogS": -1.5}. For a categorical
# panel this is the one-hot of the class to request, or the string
# "all_classes", which cycles the panel across generation batches so one job
# covers every class and the macro-average has something to average.
sample_conditions: null

# fraction of TRAINING examples whose condition vector is replaced with zeros,
# drawn under the job seed. Conditional jobs only. This is not a regularizer:
# every conditional metric is reported against an unconditional baseline,
# meaning the same model sampled with no condition set, and with a one-hot
# condition "no condition" is the all-zeros vector. A model trained only on
# one-hot inputs has never seen it, so the baseline would measure what the
# model does outside its training distribution and the conditional-minus-
# baseline gap would be partly an artifact. Dropping the condition on a tenth
# of the examples makes zeros a legitimate input meaning "unspecified".
# Validation keeps its conditions, so model selection picks the best
# conditional model rather than the best average of two modes.
condition_dropout: 0.1

# null = the condition is a property value; a list of column names = the
# condition is a class label over that one-hot panel, e.g.
# ["is_ar", "is_btk", "is_egfr"]. CLAUDE.md gives the continuous conditional
# metrics no definition for a class label and the categorical ones no
# definition for a value, so this is what selects between the two sets. The
# names must be the same columns, in the same order, as conditioning.properties.
condition_classes: null

# a generated molecule counts as hitting its requested condition value when the
# achieved property is within this much of it, per property name. CLAUDE.md's
# condition_success_rate_<property> is defined against this tolerance.
condition_tolerance: null

# --- goal-directed RL ------------------------------------------------------

# checkpoint the agent and the frozen prior start from
pretrained_model_path: null

# "target_size={int}", "logp_target={float}", "QED", "{name}_activity", or the
# name of an entry in `oracles`
score_components: ["QED"]
score_thresholds: [0.5]
# "continuous" ignores the thresholds; "binary" scores 1 iff all are met
score_type: binary

# paths to pickled scikit-learn activity models, keyed by score component
qsar_models: {}

# user-defined oracles, {name: spec}; spec has "type" ("sklearn" | "python" |
# "vina") plus that type's parameters, and optional "transform"/"direction"
oracles: {}

# uncertainty-aware reward and loss shaping (Medina & Janet, arXiv:2606.24990)
# "mode": none | score | loss | both; "components" maps a component to its method
uncertainty_modulation: {}

# --- RL schedule: separate keys, not the supervised ones -------------------
# A learning step is not an epoch. Reusing `epochs` and `sample_every` for
# reinforcement learning meant the two paths could not take different values,
# and a change to the supervised defaults silently changed every optimization
# run. A goal_directed job that sets `epochs` or `sample_every` is rejected.
# Defaults from Atance et al. 2022, which CLAUDE.md already cites.
rl_steps: 200
rl_best_agent_every: 5
rl_eval_every: 5
# per experiment; null means fall back to `batch_size`
rl_batch_size: null

# contribution of the score to the augmented log-likelihood
sigma: 20
# contribution of the best agent so far (BASF) to the loss, in [0, 1]
alpha: 0.5

# total oracle call budget; null = run for `rl_steps` steps instead. THE BUDGET
# IS THE STOPPING RULE for every reported campaign: reinforcement learning can
# be run indefinitely and the extra steps buy less and less, so we do not train
# to convergence and we do not early-stop on a plateau. An oracle call is one
# unique molecule scored by the COMPLETE set of surrogates that makes up the
# objective, not one call per component, or an objective with six components
# would look six times more expensive than one with one.
# null here and set per campaign: the budget is a property of the reported
# experiment, not of the code, and a global default silently converts every
# smoke job from step-capped to budget-capped.
oracle_budget: null
# oracle call counts at which to checkpoint. The three comparison budgets are
# nested points on ONE 10,000-call trajectory rather than three runs: the run
# checkpoints as the counter crosses each, which is what a budget curve means
# and costs one run instead of three. 10,000 is the end of the run and is the
# final checkpoint.
checkpoint_oracle_counts: [1000, 5000]
# molecules sampled from each budget checkpoint for reporting. NOT CHARGED TO
# THE BUDGET: the budget counts molecules scored *during optimization*, and
# these are drawn afterward. A 10,000-call run therefore produces three samples
# of 10,000 molecules, one per checkpoint, and none of those 30,000 scorings
# moves the counter.
eval_sample_size: 10000
# the EVALUATION surrogate: the same featurization and model class as the
# optimization surrogate, refitted on all data including the test split. It
# only ever rescores the final molecules and is never the reward, so it is a
# separate key from anything in `oracles:`. Null = eval_oracle_top10_mean
# records a null with that reason.
evaluation_oracle: null
# the molecules the OPTIMIZATION surrogate was fitted on, for
# top100_outside_domain_rate. Not the generative model's training split, which
# is a different set. Null = that key records a null with that reason.
surrogate_training_set: null
# a generated molecule is outside the surrogate's applicability domain when its
# maximum ECFP4 Tanimoto to that training set falls below this.
applicability_similarity_floor: 0.3

# a molecule is a success at or above this score
success_threshold: 0.5

# What success_rate counted, in words. Set per experiment beside
# success_threshold: a rate with no statement of the criterion is not readable,
# and for a composite objective the threshold alone does not carry it. Echoed
# verbatim into metrics.json.
success_definition: null

# Output of scripts/screen-library.py for this experiment's declared screening
# library. Set it on a goal_directed job to get vs_baseline_top10_at_* and the
# vs_delta_top10_at_* comparison; left unset, both report as unavailable.
screening_baseline_results: null

# molecules.smi of the UNCONDITIONAL sample this conditional job's post-hoc
# baseline reranks. CLAUDE.md calls baseline_posthoc_ the one baseline that can
# falsify the conditional claim -- if an unconditional model plus a one-line
# reranking reaches the same class_selectivity_margin, the conditioning bought
# nothing -- and the key was set in two smoke tests and no real job, so those
# keys were an explicit null everywhere and the conditional numbers could be
# reported but not falsified. Left unset, they still report as unavailable.
baseline_results_dir: null

# --- generation and evaluation ---------------------------------------------

# "generate" writes molecules and metrics; "evaluate" computes NLL and UC-JSD
sample_mode: generate

# Is this dataset bifunctional (PROTACs, degraders)? It changes which
# synthesizability measure is reported and gated on, because whole-molecule SA
# score reads a PROTAC's size as difficulty: on 500 real TPD-DB degraders the
# median SA is 4.71 and 58.6% fail `sa_score < 4.5`, against 2.87 and 6.2% for
# drug-like ZINC. Those degraders were made, so the gate rejects chemistry that
# exists.
#   true  -> retrotac_mean/_median are reported, and quality_filtered_top10_mean
#            gates on RetroTAC instead of SA score. Needs tools/RetroTAC.
#   false -> SA score only, which is correct for drug-like molecules and for
#            molecular glues.
# SA score is reported either way, and for a bifunctional dataset it is also
# the right measure for the decomposed warheads, where molecules are drug-sized.
bifunctional: false

# Which triage stack the `_filtered` metrics are computed through. Named rather
# than derived from `bifunctional`, because that boolean has no third value and
# a battery experiment therefore ran the drug-like stack in silence: MCF/PAINS
# alerts reject DMF, DEF, the formates and the whole acyclic formal/acetal
# family, which is the chemotype the solvent campaign searches for, and 26.3%
# of the Batt-SLM training corpus. Validated against the implemented set, and
# cross-checked against `bifunctional`, which must agree with it.
#   drug_like       -> structural_alerts, then sa_score < 4.5
#   bifunctional    -> structural_alerts, retrotac >= 0.30 on the whole
#                      molecule, then sa_score < 4.5 on the decomposed warhead
#   battery_solvent -> no_fluorine, dielectric_constant < 10.0, then
#                      chelation_propensity cpi < 0.5. No alert stage: the
#                      published funnel has none, and MCF/PAINS reject 7 of the
#                      15 reference solvents. The last two stages are not
#                      implemented and record categorized nulls; see
#                      src/metrics/_filters.py for what each needs.
triage_stack: drug_like

# property_window_rate: the fraction of unique valid molecules whose every
# named property falls inside its window. Each experiment sets its own bounds
# and they are echoed into metrics.json beside the value, because the rate is
# meaningless without them. The default is the Rule of 5, which suits the
# drug-like development sets; a degrader or electrolyte program overrides it.
property_window:
  mol_weight: [null, 500.0]
  logp: [null, 5.0]
  hbd: [null, 5.0]
  hba: [null, 10.0]

# --- SLURM -----------------------------------------------------------------

# Everything that differs between clusters lives here. Another cluster is a
# different block, not a code change. The values below are Arrhenius.

slurm:
  # MANDATORY: the project to charge. Submission fails without it.
  # A GPU job may need a -gpu suffix on the account name while a CPU job uses
  # the bare name; on Arrhenius it does, e.g. naiss2024-5-630-gpu for a GPU job
  # and naiss2024-5-630 for a CPU one.
  account: null

  # A CPU job is charged to the bare project name on Arrhenius while a GPU job
  # needs the -gpu suffix, so submit.py strips the suffix when gpus is 0. Set
  # this only if your cluster names the CPU account some other way.
  account_cpu: null

  # Left unset, partition_gpu is used when gpus > 0 and partition_cpu otherwise.
  partition: null
  partition_cpu: cpu
  partition_gpu: gpu

  # Always set explicitly: the Arrhenius default is 2 hours, which kills a
  # real training run part-way through. See the walltime procedure in RUN.md.
  time: "24:00:00"

  # One GH200 superchip: one GPU, one task, 72 cores. Not a whole node.
  gpus: 1
  ntasks: 1
  cpus_per_task: 72

  # null leaves it to the partition default, which on a GPU node is the memory
  # attached to the requested superchip.
  memory: null

  # Lmod modules, loaded in order. A different cluster is a different list.
  modules:
    - GPU/buildenv-nvhpc/25.9-cu13.0
