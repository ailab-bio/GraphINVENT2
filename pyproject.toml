[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphinvent2"
version = "2.0.0"
description = "Graph-based molecular generation and optimization with GGNNs and RL"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"

# Core dependencies — PyTorch is listed here as a minimum version.
# For GPU support install the CUDA-specific build first (see README).
dependencies = [
    "torch>=2.0",
    "torchvision",
    "torchaudio",
    "rdkit>=2023.3",
    "numpy",
    "h5py",
    "tqdm",
    "scikit-learn",
    "matplotlib",
    "tensorboard",
]

[project.optional-dependencies]
# pip install -e ".[docking]"  — AutoDock Vina oracle (structure-based scoring)
docking = ["vina", "meeko"]

# pip install -e ".[dev]"  — linting / type checking during development
dev = ["black", "ruff", "mypy", "pytest", "pre-commit"]

[project.scripts]
# Run jobs from anywhere in the repo: graphinvent-submit --config jobs/pretrain/params.json
graphinvent-submit = "submit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"graphinvent" = ["tools/*", "parameters/*", "gnn/*"]
"metrics" = []
"oracles" = []

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # pycodestyle errors/warnings, pyflakes, isort
ignore = [
    "E501",   # line too long — black handles this
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]  # tests manipulate sys.path before importing bare graphinvent modules

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false   # too noisy for ML code with Any-typed tensors
