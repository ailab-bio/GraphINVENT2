[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphinvent2"
version = "2.0.0"
description = "Graph-based molecular generation and optimization with GGNNs and RL"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"

# torch >= 2.11 is a hard floor, not a preference: on Linux aarch64 the plain
# PyPI wheel is CPU-only up to and including 2.10, so a looser pin resolves to
# a build where torch.cuda.is_available() is False with no error anywhere.
# See RUN.md for the cu130 index, which is the alternative route.
dependencies = [
    # Locked at the PyPI resolution, which is correct on macOS arm64 and is
    # the CPU-only build on Linux aarch64. The CUDA wheel is NOT declared under
    # [tool.uv.sources]: pinning an index here would force the CUDA index on
    # the laptop too, and the aarch64 CUDA 13 wheel has never been resolved on
    # this machine, so declaring it would be an untested pin in the one file
    # that is meant to be authoritative. The cluster installs it over the
    # locked version with the exact line in RUN.md Step 3, whose CHECK asserts
    # torch.version.cuda is not None. Decided 2026-10-19.
    "torch>=2.11",
    "rdkit>=2023.3",
    "numpy<2.5",
    "h5py>=3.8",
    "pyyaml",
    "tqdm",
    "scikit-learn",
    "matplotlib",
    "tensorboard",
]

[project.optional-dependencies]
# uv sync --extra surrogates  — XGBoost activity models.
# 3.2.0 is the first aarch64 build with GPU support, so that is the floor.
surrogates = ["xgboost>=3.2.0"]

# uv sync --extra metrics  — Frechet ChemNet Distance, which CLAUDE.md calls
# the headline number for unconditional generation. Pinned because the ChemNet
# weights ship inside the wheel, so the version *is* the reference model.
# Pure Python over torch/numpy/scipy, so it resolves on both macOS arm64 and
# Linux aarch64.
metrics = ["fcd==1.2.2"]

# There is deliberately no `components` extra. PROTAC-Splitter pins
# xgboost<3 while this project needs xgboost>=3.2 for aarch64 GPU support, so
# the two cannot share an environment and declaring it here made the dependency
# set unsatisfiable. `src/metrics/_components.py` calls into its own
# interpreter, which `tools/install.sh` builds; nothing imports it in-process.

# uv sync --extra docking  — AutoDock Vina oracle (structure-based scoring).
# vina publishes no aarch64 wheel at any version, so on an ARM cluster this
# extra does not install; see RUN.md for the conda-forge route.
docking = ["vina", "meeko"]

# pip install -e ".[dev]"  — linting / type checking during development
# pytest-timeout with a default: a metric that stops terminating used to
# hang the suite at 100% CPU with no error rather than failing.
dev = ["black", "ruff", "mypy", "pytest", "pytest-timeout", "pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"graphinvent" = ["parameters/*", "gnn/*"]
"metrics" = []
"oracles" = []

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # pycodestyle errors/warnings, pyflakes, isort
ignore = [
    "E501",   # line too long — black handles this
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]  # tests manipulate sys.path before importing bare graphinvent modules

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
timeout_method = "thread"
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false   # too noisy for ML code with Any-typed tensors
