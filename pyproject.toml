[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphinvent2"
version = "2.0.0"
description = "Graph-based molecular generation and optimization with GGNNs and RL"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"

# torch >= 2.11 is a hard floor, not a preference: on Linux aarch64 the plain
# PyPI wheel is CPU-only up to and including 2.10, so a looser pin resolves to
# a build where torch.cuda.is_available() is False with no error anywhere.
# See RUN.md for the cu130 index, which is the alternative route.
dependencies = [
    "torch>=2.11",
    "rdkit>=2023.3",
    "numpy<2.5",
    "h5py>=3.8",
    "pyyaml",
    "tqdm",
    "scikit-learn",
    "matplotlib",
    "tensorboard",
]

[project.optional-dependencies]
# uv sync --extra surrogates  — XGBoost activity models.
# 3.2.0 is the first aarch64 build with GPU support, so that is the floor.
surrogates = ["xgboost>=3.2.0"]

# uv sync --extra components  — PROTAC-Splitter, for the component-level
# metrics on bifunctional molecules (Ribes et al., J. Cheminform. 18:30, 2026).
# Not on PyPI, so it installs from the repository.
components = [
    "protac-splitter @ git+https://github.com/ribesstefano/PROTAC-Splitter",
]

# uv sync --extra docking  — AutoDock Vina oracle (structure-based scoring).
# vina publishes no aarch64 wheel at any version, so on an ARM cluster this
# extra does not install; see RUN.md for the conda-forge route.
docking = ["vina", "meeko"]

# pip install -e ".[dev]"  — linting / type checking during development
dev = ["black", "ruff", "mypy", "pytest", "pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"graphinvent" = ["parameters/*", "gnn/*"]
"metrics" = []
"oracles" = []

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # pycodestyle errors/warnings, pyflakes, isort
ignore = [
    "E501",   # line too long — black handles this
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]  # tests manipulate sys.path before importing bare graphinvent modules

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false   # too noisy for ML code with Any-typed tensors
