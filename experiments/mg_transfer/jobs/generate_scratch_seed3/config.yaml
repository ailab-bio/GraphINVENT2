# SEED 3 OF 3. The seed here is the TRAINING seed: this job samples the
# checkpoint that scratch_control_seed3 produced, not seed 1's checkpoint resampled.
# Until 2026-10-26 all three of these jobs named one checkpoint, so Table 2's
# interval was the spread of sampling from a single training run. A seed
# controls the training run, so the three arms are three training jobs and each
# sampling job reads the arm that matches it.
# `scripts/aggregate-seeds.py` groups on the _seed<N> suffix and writes the
# aggregate.
# Identical to generate_scratch/config.yaml except for the seed and the
# checkpoint it reads.
job_type: generate
sample_mode: generate
pretrained_model_path: experiments/mg_transfer/jobs/scratch_control_seed3/checkpoints/model_restart_20.pth
n_samples: 10000
batch_size: 500
device: cuda
# WALLTIME AND MEMORY DERIVED, NOT MEASURED ON THE CLUSTER. By the
# RUN.md Part 1 procedure, from the CPU per-unit costs in RUN.md and
# manuscript/experiment-plan.md, times 1.5, rounded up to the hour:
#   10,000 molecules, scaled to max_nodes 54
#   = 0.06 h x 1.5 -> 1 h
# This is a CPU extrapolation. Training will finish well inside it on a
# GPU; generation gains much less, because it is a sequential
# autoregressive loop with a Python-level decode. Re-measure on
# Arrhenius and replace these two numbers with what was observed.
slurm:
  time: "01:00:00"
  memory: 19G
  gpus: 1
seed: 3
