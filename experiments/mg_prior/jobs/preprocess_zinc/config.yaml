job_type: preprocess
# The raw release is a CSV whose SMILES field is quoted and spans two physical
# lines, which the whitespace-delimited reader cannot parse: it fails on line 1.
# scripts/zinc-create-dataset.py parses it once and writes a plain .smi.
smiles_file: data/datasets/zinc250k/zinc250k.smi
dataset_dir: zinc250k
max_n_nodes: 54
split_type: scaffold
train_frac: 0.8
valid_frac: 0.1
batch_size: 1000
# WALLTIME AND MEMORY DERIVED, NOT MEASURED ON THE CLUSTER. By the
# RUN.md Part 1 procedure, from the CPU per-unit costs in RUN.md and
# manuscript/experiment-plan.md, times 1.5, rounded up to the hour:
#   249,455 molecules (corpus) x 45 ms
#   = 3.12 h x 1.5 -> 5 h
# This is a CPU extrapolation. Training will finish well inside it on a
# GPU; generation gains much less, because it is a sequential
# autoregressive loop with a Python-level decode. Re-measure on
# Arrhenius and replace these two numbers with what was observed.
slurm:
  time: "05:00:00"
  memory: 19G
  gpus: 0

# The transfer pair shares one feature vocabulary. Without this the base and
# task corpora are scanned separately, their atom-type and formal-charge sets
# differ, and the node feature width and action tensor differ with them, so the
# base checkpoint cannot load into the task model at all. Measured on toy
# subsets of these two corpora: 116 against 113 node features and a 12960
# against 3840 action tensor, which is a loud RuntimeError rather than a silent
# fallback, but it stops the transfer arm dead.
extra_dataset: data/datasets/tpddb_glue/tpddb_glue.smi
