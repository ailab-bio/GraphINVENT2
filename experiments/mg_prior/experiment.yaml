# The molecular glue base corpus: ZINC250k drug-like space. The prior
# trained here is the starting point for mg_transfer and for nothing
# else.
dataset_dir: zinc250k
max_n_nodes: 54
# Glues are drug-like: SA score at the whole-molecule level, no RetroTAC, no
# component decomposition.
bifunctional: false
seed: 1
slurm:
  account: naiss2024-5-630-gpu
  # partition left unset on purpose: submit.py uses partition_gpu when
  # gpus > 0 and partition_cpu otherwise, so a preprocess or screening job
  # with gpus: 0 does not occupy a GPU node. Hard-coding gpu here sent 13
  # CPU-only jobs to the GPU partition, one of them for 24 hours.
