# The battery solvent corpus: Batt-SLM's 115,756 molecules. This is what the
# source work trains its prior on; there is no separate PubChem base corpus and
# no transfer stage in that work, and PubChem-120K was never distributed. The
# prior trained here is the starting point for battery_conditional and
# battery_goal_directed.
dataset_dir: battslm
max_n_nodes: 16
bifunctional: false
# The battery solvent triage stack: no_fluorine, permittivity < 10.0, then
# chelation propensity index < 0.5. Declared because the stack used to be
# selected on `bifunctional`, a boolean with no third value, so these
# experiments silently ran the DRUG-LIKE stack -- whose MCF/PAINS alerts reject
# 7 of the 15 reference solvents in this program's own validation set (DMF, DEF,
# the formates and the whole acyclic formal/acetal family the campaign searches
# for) and 18.9% of the Batt-SLM corpus -- while none of the campaign's own
# gates ran. There is no alert stage here: the published funnel has none either,
# and an extra stage would make our counts un-comparable to the published ones,
# which is the comparison this program's claim rests on. The last two stages are
# not implemented, so every `_filtered` key here is a categorized null naming
# what is missing. That is the correct state: a fabricated number is worse than
# an absent one.
triage_stack: battery_solvent
seed: 1
slurm:
  account: naiss2024-5-630-gpu
  # partition left unset on purpose: submit.py uses partition_gpu when
  # gpus > 0 and partition_cpu otherwise, so a preprocess or screening job
  # with gpus: 0 does not occupy a GPU node. Hard-coding gpu here sent 13
  # CPU-only jobs to the GPU partition, one of them for 24 hours.

# Names the split directory every job here reads; see Data splits.
split_type: scaffold
