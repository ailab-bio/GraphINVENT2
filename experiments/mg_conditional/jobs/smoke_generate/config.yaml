# SMOKE TEST. The experiment's real config with only the size parameters
# overridden: a few hundred molecules from the real dataset, one or two epochs,
# a few hundred samples. The features, conditioning, scoring function and split
# strategy are the experiment's own, because the point is to catch the defects
# that have nothing to do with scale.
#
#   python submit.py experiments/mg_conditional/jobs/smoke_generate
job_type: generate
sample_mode: generate
dataset_dir: toy_glue_cond
pretrained_model_path: experiments/mg_conditional/jobs/smoke_train/checkpoints/model_restart_2.pth
n_samples: 200
batch_size: 100
device: cpu
# Cycle the panel across generation batches, so one job produces molecules for
# every class and the macro-average has three numbers to average rather than
# one.
sample_conditions: all_classes
# The unconditional arm's sample, which the post-hoc filter baseline reranks.
# Without it the conditional numbers can be reported but not falsified.
baseline_results_dir: experiments/mg_transfer/jobs/smoke_generate/results/molecules.smi
