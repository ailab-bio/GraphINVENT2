# SMOKE TEST. The experiment's real config with only the size parameters
# overridden: a few hundred molecules from the real dataset, one or two epochs,
# a few hundred samples. The features, conditioning, scoring function and split
# strategy are the experiment's own, because the point is to catch the defects
# that have nothing to do with scale.
#
#   python submit.py experiments/protac_unconditional/jobs/smoke_preprocess
job_type: preprocess
smiles_file: data/datasets/toy_protac/toy_protac.smi
split_type: warhead_scaffold
train_frac: 0.8
valid_frac: 0.1
batch_size: 100
dataset_dir: toy_protac
max_n_nodes: 50
