job_type: preprocess
# BLOCKER: the enumerated library is not yet fetched by download_data.py.
smiles_file: data/raw/protac_splitter/enumerated_protacs.smi
dataset_dir: protac_enumerated
split_type: scaffold
train_frac: 0.8
valid_frac: 0.1
batch_size: 1000
# WALLTIME AND MEMORY ARE UNVERIFIED ESTIMATES. Nothing in this experiment has
# run on Arrhenius. The basis of each estimate is stated beside it; re-measure
# by the RUN.md Part 1 walltime procedure after the first successful run.
# Basis: 1.3M molecules at max_nodes 108. Preprocessing is superlinear in
# molecule size and this is the largest corpus in the paper. Deliberately
# generous; measure before trusting.
slurm:
  time: "24:00:00"
  gpus: 0
  memory: "128G"

# The transfer pair shares one feature vocabulary. Without this the base and
# task corpora are scanned separately, their atom-type and formal-charge sets
# differ, and the node feature width and action tensor differ with them, so the
# base checkpoint cannot load into the task model at all. Measured on toy
# subsets of these two corpora: 116 against 113 node features and a 12960
# against 3840 action tensor, which is a loud RuntimeError rather than a silent
# fallback, but it stops the transfer arm dead.
extra_dataset: data/datasets/tpddb_protac/tpddb_protac.smi
