job_type: unconditional
dataset_dir: tpddb_protac
# Transfer learning IS an unconditional job with resume_from set. Using
# pretrained_model_path here is rejected, because it would silently train from
# scratch.
resume_from: experiments/protac_unconditional/jobs/prior_enumerated/checkpoints/model_restart_40.pth
epochs: 20
batch_size: 500
accumulation_steps: 4
sample_every: 5
n_samples: 10000
device: cuda
# WALLTIME AND MEMORY ARE UNVERIFIED ESTIMATES. Nothing in this experiment has
# run on Arrhenius. The basis of each estimate is stated beside it; re-measure
# by the RUN.md Part 1 walltime procedure after the first successful run.
slurm:
  time: "12:00:00"
  gpus: 1
