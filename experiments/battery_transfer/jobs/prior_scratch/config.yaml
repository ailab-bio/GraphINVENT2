job_type: unconditional
# The control, and the only battery prior that can run today.
# Published schedule was 1,000 epochs at lr 1e-4 decayed 0.95 every 100, batch
# 1,000, accumulation 512. 60 epochs is a first attempt; see instructions.md.
epochs: 60
batch_size: 1000
accumulation_steps: 512
sample_every: 10
n_samples: 10000
device: cuda
# WALLTIME AND MEMORY ARE UNVERIFIED ESTIMATES. Nothing here has run on
