# Targets for the goal-directed sweep.
#
# Each entry defines one optimization objective and is run independently, once
# per seed, against the same pretrained prior.  Keeping every setting but the
# objective fixed is what makes the runs comparable.
#
#   name        : the score component name used for this run
#   oracle      : the oracle spec, copied verbatim into the job's "oracles"
#                 block.  "type" is "sklearn", "python", or "vina"; see
#                 tutorials/06_custom_oracles.md
#   threshold   : score at or above which a molecule counts as a success
#   description : what the objective is, and where the model came from
#
# The models referenced below do not ship with the repository.  Train them from
# your own data with src/graphinvent/tools/train-surrogate.py, or point the
# entries at a docking setup.  The paths here are placeholders.

oracles:
  - name: target_a
    oracle:
      type: sklearn
      path: data/surrogates/target_a_rf.pkl
      output: proba
      direction: maximize
    threshold: 0.5
    description: >
      Activity against the primary target, from a random forest over Morgan
      fingerprints trained on in-house or ChEMBL assay data.  Check the
      held-out metrics printed by train-surrogate.py before trusting a sweep
      built on this.

  - name: target_a_selective
    oracle:
      type: sklearn
      path: data/surrogates/target_a_rf.pkl
      output: proba
      direction: maximize
    threshold: 0.5
    description: >
      The same primary target, intended to be run with an anti-target added to
      score_components so the two objectives trade off.  Add the second oracle
      to the template's "oracles" block with direction "minimize".

  # Structure-based alternative, for a target with a usable structure but too
  # little assay data to train a surrogate.  Docking costs roughly a second per
  # molecule per core, so budget the run accordingly.
  # - name: target_b_dock
  #   oracle:
  #     type: vina
  #     receptor: data/receptors/target_b.pdbqt
  #     center: [12.0, 3.4, -8.1]
  #     box_size: [20.0, 20.0, 20.0]
  #     exhaustiveness: 8
  #     n_workers: 8
  #   threshold: 0.5
  #   description: AutoDock Vina docking against target B.

seeds: [0, 1, 2]
