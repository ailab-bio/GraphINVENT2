job_type: preprocess
smiles_file: data/datasets/dev_zinc/dev_zinc.smi
train_frac: 0.8
valid_frac: 0.1
batch_size: 1000
# dev_zinc's 99th-percentile heavy-atom count, stated rather than detected:
# max_n_nodes identifies a split set, because it drops oversized molecules
# before splitting, and three jobs preprocess dev_zinc into the same
# split_scaffold/ directory. mg_prior/smoke_preprocess_zinc must state the same
# value, since detection there scans dev_glue as well and returns 33.
max_n_nodes: 34

# Preprocessing is CPU-only work, so it asks for no GPU.

# Walltime by the RUN.md Part 1 procedure: 3 s measured on CPU for 1,000 ZINC molecules; 30 min is pure margin.
# THIS IS A CPU EXTRAPOLATION. RUN.md Part 1 says these must be
# re-measured on the GPU before they are trusted; nothing here was run
# on a GPU or a cluster.
slurm:
  time: "00:30:00"
  gpus: 0
