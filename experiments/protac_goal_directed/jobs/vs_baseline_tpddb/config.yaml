# Virtual screening over the task corpus train+validation split, same oracle,
# same budget. NOT YET IMPLEMENTED as a job type (ledger L27 / Prompt E 5.5);
# this config records the intent so the dependency is visible in the runbook.
job_type: generate
sample_mode: generate
pretrained_model_path: experiments/protac_unconditional/jobs/prior_transfer/checkpoints/model_restart_20.pth
n_samples: 10000
batch_size: 500
device: cuda
# WALLTIME AND MEMORY ARE UNVERIFIED ESTIMATES. Nothing here has run on
# Arrhenius. Re-measure by the RUN.md Part 1 walltime procedure.
slurm:
  time: "02:00:00"
  gpus: 0
