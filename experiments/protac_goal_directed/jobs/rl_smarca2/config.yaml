job_type: goal_directed
pretrained_model_path: experiments/protac_unconditional/jobs/prior_transfer/checkpoints/model_restart_20.pth
# The RL schedule uses its own keys. Setting `epochs` or `sample_every` here is
# rejected: a learning step is not an epoch.
rl_steps: 200
rl_best_agent_every: 5
rl_eval_every: 5
rl_batch_size: 256
accumulation_steps: 1
n_samples: 2000
# sigma 20 for an activity objective, per CLAUDE.md's fixed RL settings.
sigma: 20
alpha: 0.5
score_components: ["smarca2_pdc50_activity"]
score_type: continuous
oracles:
  smarca2_pdc50_activity:
    type: sklearn
    path: data/surrogates/protac_pdc50_smarca2_oracle.pickle
# Set here and never inherited: 6.0 is 1 uM on the pDC50 scale.
success_threshold: 6.0
success_definition: "predicted pDC50 >= 6.0 (DC50 <= 1 uM) from the optimization surrogate, over unique valid molecules"
# The per-step trajectory -- validity, uniqueness, novelty and internal
# diversity at every evaluation step -- is written to TensorBoard and nowhere
# else now that logs/generation.log is gone. The diversity-collapse figure is
# drawn from it, so this must stay true for any run that is reported.
use_tensorboard: true
device: cuda
# WALLTIME AND MEMORY ARE UNVERIFIED ESTIMATES. Nothing here has run on
# Arrhenius. Re-measure by the RUN.md Part 1 walltime procedure.
slurm:
  time: "24:00:00"
  gpus: 1
