dataset_dir: tpddb_protac
max_n_nodes: 108
bifunctional: true
# The bifunctional triage stack: structural alerts, then RetroTAC >= 0.30 on the
# whole molecule, then sa_score < 4.5 on the decomposed warhead. Named rather
# than derived from the boolean above, and the two are cross-checked.
triage_stack: bifunctional
seed: 1
slurm:
  account: naiss2024-5-630-gpu
  # partition left unset on purpose: submit.py uses partition_gpu when
  # gpus > 0 and partition_cpu otherwise, so a preprocess or screening job
  # with gpus: 0 does not occupy a GPU node. Hard-coding gpu here sent 13
  # CPU-only jobs to the GPU partition, one of them for 24 hours.

# property_window_rate for a bifunctional program. The Rule of 5 default is not
# merely wrong here, it is inverted: measured on 2,000 real TPD-DB degraders
# only 10.2% fall inside the Ro5 window, while a toy run that generated
# single-atom fragments scored 1.0. The metric exists to catch a model drifting
# toward smaller non-degrader-like molecules, and with only upper bounds it
# scores that exact failure as perfect. These are the TACFormer PROTAC-like
# bounds from manuscript/experiment-plan.md, lower bounds included.
property_window:
  mol_weight: [650.0, 1200.0]
  tpsa: [120.0, 320.0]
  rotatable_bonds: [12.0, 45.0]
  hba: [8.0, 24.0]
  hbd: [0.0, 8.0]

# The optimization surrogate, fitted by
# experiments/surrogate_protac_optimization/smarca2/fit.sh. Held-out RMSE 0.488
# against a mean-prediction baseline of 0.639 on a warhead-scaffold split,
# Spearman 0.567: it beats the baseline, which is the kill criterion for
# this arm. See that directory's PERFORMANCE.md.
#
# THE TRANSFORM IS NOT OPTIONAL and its bounds are a modeling decision, stated
# here and in the write-up. The surrogate reports pDC50 directly, which spans
# 5.94 to 10.05 on the 241-row training table; the default identity transform
# clamps to [0, 1], so every prediction would score exactly 1.0, the augmented
# likelihood would add a constant, and the BAR loss would express no preference
# between molecules. `clipped_linear` from 5.0 to 10.0 makes the score linear
# in pDC50 across the whole label range: 5.0 (DC50 = 10 uM, inactive) scores 0
# and 10.0 (DC50 = 0.1 nM, beyond what the data resolves) scores 1.
# THE ARTIFACT NAME. `smarca2/pdc50.pickle` is the fit `fit.sh` writes, one
# name per (target, endpoint). It replaces `smarca2/optimization.pickle`, the
# superseded name from the two-surrogate design, and it carries the five
# warhead-scaffold-grouped cross-validation fold models as well as the
# full-data fit. Those fold models are what makes the ensemble-disagreement
# reward-hacking detector a real measurement: their per-molecule spread is
# disagreement between models fitted on different rows, where the old pickle
# could only offer the spread across one forest's trees, which all saw the
# same rows. Held-out numbers and their fold spread are in
# experiments/surrogate_protac_optimization/smarca2/PERFORMANCE.md.
oracles:
  smarca2_pdc50_activity:
    type: sklearn
    path: experiments/surrogate_protac_optimization/smarca2/pdc50.pickle
    output: predict
    direction: maximize
    transform:
      type: clipped_linear
      low: 5.0
      high: 10.0

# The evaluation surrogate rescores the final molecules with a model that saw
# strictly more data than the one that rewarded them. It is never the reward,
# so it is not in `oracles:`. A large gap against top10_mean_at_10k, when the
# two agree on held-out real molecules, is evidence of exploitation.
# It carries the SAME output and transform as the optimization oracle, because
# a gap between two differently scaled scores measures the scaling. `output`
# was unset, which defaulted to `proba` and called predict_proba on a
# RandomForestRegressor; the metrics layer caught the AttributeError and
# recorded eval_oracle_top10_mean as a missing optional tool, so the detector
# reported its own misconfiguration as an absent dependency.
evaluation_oracle:
  type: sklearn
  # Written by experiments/surrogate_protac_evaluation/fit.sh. This used to
  # name surrogate_protac_optimization/smarca2/evaluation.pickle, which no
  # script writes: the file on disk was an artifact of the superseded
  # two-surrogate layout, so eval_oracle_top10_mean was computed against a
  # pickle nobody could regenerate and would have raised FileNotFoundError
  # the moment it was cleaned up.
  path: experiments/surrogate_protac_evaluation/smarca2_pdc50.pickle
  output: predict
  direction: maximize
  transform:
    type: clipped_linear
    low: 5.0
    high: 10.0
# The set the OPTIMIZATION surrogate was fitted on, for
# top100_outside_domain_rate. Not the generative model's training split.
surrogate_training_set: data/surrogates/smarca2_pdc50.tsv

# warhead_scaffold, because a whole-molecule Bemis-Murcko scaffold of a
# PROTAC contains every ring system and is nearly unique per compound, so a
# whole-molecule scaffold split degenerates to random and leaks analogues.
# It names the split directory every job here reads, so it is declared once.
split_type: warhead_scaffold
