job_type: generate
sample_mode: generate
pretrained_model_path: experiments/tutorial_conditional/jobs/logp/checkpoints/model_restart_4.pth
n_samples: 200
batch_size: 20
device: cpu
sample_conditions:
  logp: from_train
  mol_weight: from_train
# A molecule counts as hitting its request within this much of the asked value.
condition_tolerance:
  logp: 0.5
  mol_weight: 25.0

# Walltime by the RUN.md Part 1 procedure: 4 s measured on CPU for 100 samples; x1.5 and rounded up.
# THIS IS A CPU EXTRAPOLATION. RUN.md Part 1 says these must be
# re-measured on the GPU before they are trusted; nothing here was run
# on a GPU or a cluster.
slurm:
  time: "01:00:00"
  gpus: 1
