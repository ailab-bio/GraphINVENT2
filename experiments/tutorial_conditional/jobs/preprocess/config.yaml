job_type: preprocess
smiles_file: data/datasets/tpddb_protac10_logp/tpddb_protac10_logp.smi
split_type: scaffold
train_frac: 0.8
valid_frac: 0.1
batch_size: 100
# One property column, logP, read from the tab-separated SMILES file.
condition_dim: 1
conditioning:
  properties: ["logP"]
  source: smiles_file

# Preprocessing is CPU-only work, so it asks for no GPU and lands on the CPU
# partition. Nested blocks merge key by key, so the rest of slurm: is inherited.
slurm:
  gpus: 0
