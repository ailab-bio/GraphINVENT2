job_type: preprocess
smiles_file: data/datasets/dev_zinc_props/dev_zinc_props.smi
train_frac: 0.8
valid_frac: 0.1
batch_size: 1000
# dev_zinc_props' 99th-percentile heavy-atom count. Stated rather than
# detected so the recorded split set does not move when the corpus does.
max_n_nodes: 34
# Two property columns, so condition_dim is 2.
condition_dim: 2
conditioning:
  properties: ["logp", "mol_weight"]
  source: smiles_file

# Walltime by the RUN.md Part 1 procedure: 4 s measured on CPU; 30 min is pure margin.
# THIS IS A CPU EXTRAPOLATION. RUN.md Part 1 says these must be
# re-measured on the GPU before they are trusted; nothing here was run
# on a GPU or a cluster.
slurm:
  time: "00:30:00"
  gpus: 0
