job_type: goal_directed
pretrained_model_path: experiments/tutorial_unconditional/jobs/debug/checkpoints/model_restart_4.pth
score_components: ["QED"]
score_thresholds: [0.0]
score_type: continuous
epochs: 4
# The analysis and its plots run on this schedule, so a 4-step tutorial has to
# set it below the default of 10 or the run produces no molecules to look at.
sample_every: 2
batch_size: 20
accumulation_steps: 1
n_samples: 20
device: cpu

# Walltime by the RUN.md Part 1 procedure: 13 s measured on CPU for 4 RL steps; x1.5 and rounded up.
# THIS IS A CPU EXTRAPOLATION. RUN.md Part 1 says these must be
# re-measured on the GPU before they are trusted; nothing here was run
# on a GPU or a cluster.
slurm:
  time: "01:00:00"
  gpus: 1
